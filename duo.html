<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo landing page</title>
    <link rel="stylesheet" href="duo.css">
</head>
<body>
    <header>
        <div class="header-part">
            <h1>duolingo</h1>
            <div>
                <h4>Site Language:</h4>
                <select name="language-selector" id="language">
                    <option value="english">English</option>
                    <option value="french">French</option>
                    <option value="arabic">Arabic</option>
                    <option value="chinese">Chinese</option>
                    <option value="oromic">Oromic</option>
                    <option value="amharic">Amharic</option>
                </select>
            </div>
        </div>
    </header>
    
    <section>
        <div class="body-part">
            <img src="asset/images (4).png" alt="World image" class="image">
            <div>
                <h1>The free, fun, and effective way to learn a language!</h1>
                <button id="first-button">Get Started</button>
                <button id="second-button">I ALREADY HAVE AN ACOUNT</button>
            </div>
        </div>
    </section>

    <footer>
       
    </footer>
</body>
</html>
